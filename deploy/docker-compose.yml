# The hosted backend: one reverse proxy, one backend container per tester.
#
# Why one container per tester: the backend is single-user by design -- one
# database, one persona, one session, one conversation slot. Running it once
# per person keeps every one of those guarantees without touching the code.
#
# Layout (all paths relative to deploy/):
#   docker-compose.yml           this file: Caddy, and the image build
#   tester.yml                   the TEMPLATES every tester's two services
#                                (backend, dashboard) extend
#   docker-compose.override.yml  GENERATED by new_tester.sh / remove_tester.sh
#                                from testers/*.yml; compose loads it by default
#   testers/NAME.{yml,env}       one tester: backend-NAME + dashboard-NAME,
#                                its host port and its token
#   routes/NAME.caddy            its /t/NAME/ route (the only dir Caddy sees)
#   data/NAME/                   that tester's database (backend /data) and
#                                data/NAME/dashboard (dashboard /data)
#   .env                         shared API keys and DOMAIN (never committed)
#
# Everyday use:  docker compose up -d            ./new_tester.sh alice
#                docker compose logs -f backend-alice   ./remove_tester.sh alice

name: brian

services:
  # Automatic TLS: Caddy gets and renews a Let's Encrypt certificate for
  # $DOMAIN on its own, as long as ports 80 and 443 reach this machine and the
  # DNS A record points here. It speaks WebSockets through reverse_proxy with
  # no extra configuration.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # One route file per tester; the Caddyfile imports routes/*.caddy.
      # Only routes/ is mounted: the tokens in testers/ stay out of the proxy.
      - ./routes:/etc/caddy/routes:ro
      - caddy_data:/data        # certificates: losing them means re-issuing
      - caddy_config:/config
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Builds the one image every tester runs; it never runs itself (the
  # profile keeps `docker compose up` from starting it). Naming it builds it:
  # `docker compose build backend-image`; new_tester.sh does so on first use.
  backend-image:
    profiles: ["build-only"]
    image: hackrice-backend:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
