[project]
name = "pipeline"
version = "0.1.0"
description = "Lifestyle tracking pipeline backend (T0 consumer, gate, reasoner, scoring)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "longevity",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "openai>=1.40",
    "numpy>=1.26",
    "pillow>=10.3",
    "python-dotenv>=1.0",
    "typesafe-sdk==0.7.1",
]

[project.optional-dependencies]
#: The phase-3 watcher (torch + open_clip): `uv sync --extra watcher`.
watcher = ["longevity[watcher]"]

[tool.uv.sources]
longevity = { path = "..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
