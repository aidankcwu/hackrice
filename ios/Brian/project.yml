# XcodeGen spec for the Bryan iPhone app. `cd ios/Brian && xcodegen generate` writes
# Brian.xcodeproj. The .xcodeproj is committed so anyone can open it; regenerate after editing this file.
# Lines marked CHECK need a human to confirm.

name: Brian
options:
  bundleIdPrefix: com.zeroist             # the app id is set explicitly below: com.zeroist.app (registered 23 Sept)
  deploymentTarget:
    iOS: "26.0"                           # Liquid Glass baseline. Every test phone must run iOS 26+.
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: "0.9.0"                         # newest tag on 2026-09-23 (`git ls-remote --tags <url>`)

targets:
  Brian:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Fixtures
        buildPhase: resources             # JSON captured from the backend; served in -demo mode
        excludes: [".gitkeep"]
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources             # App Store privacy manifest (TESTFLIGHT.md R4)
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATMockDevice          # mock glasses driven by the phone camera; DEBUG only in code
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Zeroist          # the product is Zeroist; Bryan is the voice persona
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Meta Wearables Device Access Toolkit. Matches the hardware-validated CameraAccess
        # sample (ios/xcode-project.patch, CLAUDE.md "Hardware").
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        # No `processing`: App Store validation demands BGTaskSchedulerPermittedIdentifiers with
        # it, and nothing here schedules background tasks.
        UIBackgroundModes: [bluetooth-central, audio, bluetooth-peripheral, external-accessory]
        LSApplicationQueriesSchemes: [fb-viewapp]
        MWDAT:
          AppLinkURLScheme: "bryanglasses://"
          MetaAppID: "2802824706754749"   # registered in the Wearables Developer Center; Developer Mode is off
          ClientToken: "$(CLIENT_TOKEN)"  # from Local.xcconfig, gitignored: this repo is public
          TeamID: "$(DEVELOPMENT_TEAM)"
        CFBundleURLTypes:
          - CFBundleURLName: com.zeroist.app
            CFBundleURLSchemes: [bryanglasses]
        # Local network to the Mac. Without these the WebSocket fails silently (ios/README.md).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Sends what the glasses see to the Mac running Bryan on your Wi‑Fi.
        NSBonjourServices: [_bonjour._tcp]
        # Permissions, in the words the Setup screen uses
        NSBluetoothAlwaysUsageDescription: Connects to your glasses.
        NSBluetoothPeripheralUsageDescription: Connects to your glasses.
        NSMicrophoneUsageDescription: Hears your answer when Bryan asks a question.
        NSSpeechRecognitionUsageDescription: Turns your spoken answer into text.
        NSMotionUsageDescription: Tells stillness from activity.
        NSLocationWhenInUseUsageDescription: Uses your speed to tell walking from sitting.
        NSCameraUsageDescription: Only used by the mock glasses while testing without hardware.
        # Job 3
        NSHealthShareUsageDescription: Reads last night's sleep, heart rate and steps to score your day.
        NSHealthUpdateUsageDescription: Bryan does not write to Health.
        # Job 4
        NSCalendarsWriteOnlyAccessUsageDescription: Adds a short walk to your calendar when you are short on daylight.
    entitlements:
      path: Brian.entitlements
      properties: {}                      # Job 3 adds com.apple.developer.healthkit; Job 4 adds com.apple.developer.family-controls
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        # Swift 5 language mode on purpose: SWIFT_STRICT_CONCURRENCY only applies there. In
        # Swift 6 mode the unchanged ports (QuestionListener's nonisolated deinit) do not compile.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: Zeroist             # Zeroist.app on the phone; the Swift module stays Brian
        PRODUCT_MODULE_NAME: Brian
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.zeroist.app    # App ID registered 23 Sept (Apple + Meta must match)
        DEVELOPMENT_TEAM: 3386QS4N44      # the Apple team that owns the App ID (not a secret: it is in every provisioning profile)
        ENABLE_USER_SCRIPT_SANDBOXING: true
        SWIFT_STRICT_CONCURRENCY: minimal # the ported Link/ files predate Swift 6 strictness; raise later

  BrianTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Brian
    settings:
      base:
        # The app's PRODUCT_NAME is Zeroist, so the host path XcodeGen derives from the
        # target name (Brian.app) would be wrong.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Zeroist.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)Zeroist"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Brian:
    build:
      targets:
        Brian: all
        BrianTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-demo": false                    # tick in Xcode's scheme editor, or pass -demo from simctl launch
    test:
      config: Debug
      gatherCoverageData: false
      targets: [BrianTests]
